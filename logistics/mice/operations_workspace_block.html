<div class="mice-ops-dash log-ab-dash run-sheet-dash" data-link-doctype="MICE Project">
  <div class="log-ab-banner alert alert-warning mice-ops-banner" style="display:none;margin:0 1.5rem 0.75rem;"></div>
  <div class="log-ab-top">
    <div class="run-sheet-header log-ab-head ab-summary-header-card">
      <div class="log-ab-head-stack">
        <div class="log-ab-top-row">
          <div class="log-ab-hero-col">
            <img class="log-ab-logo-img mice-ops-company-logo" alt="" style="display:none;" />
            <span class="log-ab-logo-ph mice-ops-logo-ph">Co</span>
          </div>
          <div class="log-ab-main-block">
            <div class="mice-ops-page-title"></div>
            <div class="log-ab-meta-cluster mice-ops-meta-cluster"></div>
          </div>
          <div class="ab-summary-aside">
            <div class="ab-ring-wrap">
              <div class="ab-ring ab-ring--status-submitted mice-ops-alert-ring" style="--ab-pct:0"></div>
              <div class="ab-ring-center">
                <span class="ab-ring-pct mice-ops-ring-pct">0</span>
                <span class="ab-ring-cap mice-ops-ring-cap">events</span>
              </div>
            </div>
          </div>
        </div>
        <div class="log-ab-body-block">
          <div class="header-details mice-ops-kpis"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="ab-tab-shell">
    <input type="radio" name="mice_ops_tabs" id="mice_ops_heat" class="ab-dash-tab-input" checked>
    <input type="radio" name="mice_ops_tabs" id="mice_ops_list" class="ab-dash-tab-input">
    <input type="radio" name="mice_ops_tabs" id="mice_ops_alert" class="ab-dash-tab-input">
    <div class="mice-ops-heat-toolbar">
      <button type="button" class="btn btn-default btn-xs afw-hub-refresh" title="Refresh"><i class="fa fa-refresh"></i></button>
      <span class="mice-ops-user-filter mice-ops-status-filter"><span class="mice-ops-user-filter-lbl">Status</span>
      <select class="form-control input-xs mice-ops-filter-status">
        <option value="active" selected>Active</option>
        <option value="Draft">Draft</option>
        <option value="Booked">Booked</option>
        <option value="Planning">Planning</option>
        <option value="Approved">Approved</option>
        <option value="In Progress">In Progress</option>
        <option value="On Hold">On Hold</option>
        <option value="Completed">Completed</option>
        <option value="Cancelled">Cancelled</option>
      </select></span>
      <span class="mice-ops-user-filter mice-ops-sla-filter"><span class="mice-ops-user-filter-lbl">Attention</span>
      <select class="form-control input-xs mice-ops-filter-sla">
        <option value="all" selected>All events</option>
        <option value="alerts">Alerts (due soon + overdue)</option>
        <option value="upcoming">Upcoming</option>
        <option value="live">Live</option>
        <option value="move_in_due">Move-in due</option>
        <option value="overdue">Overdue</option>
      </select></span>
      <span class="mice-ops-user-filter"><span class="mice-ops-user-filter-lbl">Owner</span>
      <select class="form-control input-xs mice-ops-filter-user"></select></span>
      <span class="mice-ops-user-filter mice-ops-airline-filter"><span class="mice-ops-user-filter-lbl">Organizers</span>
      <div class="mice-ops-airline-ms">
        <button type="button" class="btn btn-default btn-xs form-control text-left mice-ops-airline-dd-toggle" aria-expanded="false" aria-haspopup="listbox">
          <span class="mice-ops-airline-summary"></span>
        </button>
        <div class="mice-ops-airline-dd-panel" role="listbox">
          <div class="mice-ops-airline-checkboxes"></div>
        </div>
      </div></span>
    </div>
    <div class="ab-tab-bar">
      <label for="mice_ops_heat" class="ab-tlabel">Monitor</label>
      <label for="mice_ops_list" class="ab-tlabel">Lists</label>
      <label for="mice_ops_alert" class="ab-tlabel">Alerts and Notifications <span class="ab-tab-count mice-ops-alerts-tab-count">(0)</span></label>
    </div>
    <div class="ab-ro-body">
      <div class="ab-tab-panels ab-ro-shell">
        <div class="ab-tab-panel ab-tab-panel-route">
          <div class="log-ab-ro-card log-ab-ro-card--flush mice-ops-heat-card">
            <div class="mice-ops-overview">
              <div class="mice-ops-overview-top">
                <div class="mice-ops-panel">
                  <div class="mice-ops-panel-h">Pipeline</div>
                  <div class="mice-ops-stackbar"></div>
                  <div class="mice-ops-pipeline"></div>
                  <div class="mice-ops-mix"></div>
                </div>
                <div class="mice-ops-panel">
                  <div class="mice-ops-panel-h">Needs attention</div>
                  <div class="mice-ops-attention"></div>
                </div>
              </div>
              <div class="mice-ops-panel">
                <div class="mice-ops-panel-h">By user <span class="mice-ops-users-count"></span></div>
                <div class="mice-ops-userbars"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="ab-tab-panel ab-tab-panel-list">
          <div class="log-ab-ro-card log-ab-ro-card--flush mice-ops-list-card">
            <div class="mice-ops-list-toolbar">
              <span class="mice-ops-user-filter mice-ops-search-filter"><span class="mice-ops-user-filter-lbl">Find</span>
              <input type="search" class="form-control input-xs mice-ops-search" placeholder="Search lists…"></span>
            </div>
            <div class="mice-ops-overview">
              <div class="mice-ops-panel">
                <div class="mice-ops-panel-h">By user <span class="mice-ops-users-count-list"></span></div>
                <div class="mice-ops-table-wrap mice-ops-users-wrap"></div>
              </div>
              <div class="mice-ops-panel">
                <div class="mice-ops-panel-h">Event board <span class="mice-ops-work-count"></span></div>
                <div class="mice-ops-table-wrap mice-ops-work-wrap"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="ab-tab-panel ab-tab-panel-alerts">
          <div class="log-ab-ro-card log-ab-ro-card--flush mice-ops-alerts-card">
            <div class="mice-ops-alerts-toolbar">
              <button type="button" class="btn btn-default btn-xs mice-ops-alerts-refresh" title="Refresh"><i class="fa fa-refresh"></i></button>
              <span class="mice-ops-user-filter"><span class="mice-ops-user-filter-lbl">User</span>
              <select class="form-control input-xs mice-ops-filter-alert-user"></select></span>
            </div>
            <div class="mice-ops-alerts-booking-format">
              <div class="dash-alerts-section mice-ops-dash-alerts-section"></div>
              <div class="doc-alerts-cards-wrapper mice-ops-ops-alert-cards-wrap" style="margin-bottom: 0;">
                <div class="doc-alerts-cards mice-ops-ops-alert-cards"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
