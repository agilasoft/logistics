<div class="hv-ops-dash log-ab-dash run-sheet-dash" data-link-doctype="HV Brands">
  <div class="log-ab-banner alert alert-warning hv-ops-banner" style="display:none;margin:0 1.5rem 0.75rem;"></div>
  <div class="log-ab-top">
    <div class="run-sheet-header log-ab-head ab-summary-header-card">
      <div class="log-ab-head-stack">
        <div class="log-ab-top-row">
          <div class="log-ab-hero-col">
            <img class="log-ab-logo-img hv-ops-company-logo" alt="" style="display:none;" />
            <span class="log-ab-logo-ph hv-ops-logo-ph">Co</span>
          </div>
          <div class="log-ab-main-block">
            <div class="hv-ops-page-title"></div>
            <div class="log-ab-meta-cluster hv-ops-meta-cluster"></div>
          </div>
          <div class="ab-summary-aside">
            <div class="ab-ring-wrap">
              <div class="ab-ring ab-ring--status-submitted hv-ops-alert-ring" style="--ab-pct:0"></div>
              <div class="ab-ring-center">
                <span class="ab-ring-pct hv-ops-ring-pct">0</span>
                <span class="ab-ring-cap hv-ops-ring-cap">brands</span>
              </div>
            </div>
          </div>
        </div>
        <div class="log-ab-body-block">
          <div class="header-details hv-ops-kpis"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="ab-tab-shell">
    <input type="radio" name="hv_ops_tabs" id="hv_ops_heat" class="ab-dash-tab-input" checked>
    <input type="radio" name="hv_ops_tabs" id="hv_ops_list" class="ab-dash-tab-input">
    <input type="radio" name="hv_ops_tabs" id="hv_ops_alert" class="ab-dash-tab-input">
    <div class="hv-ops-heat-toolbar">
      <button type="button" class="btn btn-default btn-xs afw-hub-refresh" title="Refresh"><i class="fa fa-refresh"></i></button>
      <span class="hv-ops-user-filter hv-ops-status-filter"><span class="hv-ops-user-filter-lbl">Work</span>
      <select class="form-control input-xs hv-ops-filter-status">
        <option value="ongoing" selected>Ongoing jobs</option>
        <option value="open">Open jobs (incl. draft)</option>
        <option value="Draft">Draft</option>
        <option value="Submitted">Submitted</option>
        <option value="In Progress">In Progress</option>
        <option value="Reopened">Reopened</option>
        <option value="Completed">Completed</option>
        <option value="Closed">Closed</option>
        <option value="Cancelled">Cancelled</option>
      </select></span>
      <span class="hv-ops-user-filter hv-ops-sla-filter"><span class="hv-ops-user-filter-lbl">Attention</span>
      <select class="form-control input-xs hv-ops-filter-sla">
        <option value="all" selected>All brands</option>
        <option value="alerts">Alerts (at risk + overdue)</option>
        <option value="active">Active</option>
        <option value="live">Live</option>
        <option value="overdue">Overdue</option>
        <option value="idle">Idle</option>
      </select></span>
      <span class="hv-ops-user-filter"><span class="hv-ops-user-filter-lbl">Owner</span>
      <select class="form-control input-xs hv-ops-filter-user"></select></span>
      <span class="hv-ops-user-filter hv-ops-airline-filter"><span class="hv-ops-user-filter-lbl">Brands</span>
      <div class="hv-ops-airline-ms">
        <button type="button" class="btn btn-default btn-xs form-control text-left hv-ops-airline-dd-toggle" aria-expanded="false" aria-haspopup="listbox">
          <span class="hv-ops-airline-summary"></span>
        </button>
        <div class="hv-ops-airline-dd-panel" role="listbox">
          <div class="hv-ops-airline-checkboxes"></div>
        </div>
      </div></span>
    </div>
    <div class="ab-tab-bar">
      <label for="hv_ops_heat" class="ab-tlabel">Monitor</label>
      <label for="hv_ops_list" class="ab-tlabel">Lists</label>
      <label for="hv_ops_alert" class="ab-tlabel">Alerts and Notifications <span class="ab-tab-count hv-ops-alerts-tab-count">(0)</span></label>
    </div>
    <div class="ab-ro-body">
      <div class="ab-tab-panels ab-ro-shell">
        <div class="ab-tab-panel ab-tab-panel-route">
          <div class="log-ab-ro-card log-ab-ro-card--flush hv-ops-heat-card">
            <div class="hv-ops-overview">
              <div class="hv-ops-overview-top">
                <div class="hv-ops-panel">
                  <div class="hv-ops-panel-h">Pipeline</div>
                  <div class="hv-ops-stackbar"></div>
                  <div class="hv-ops-pipeline"></div>
                  <div class="hv-ops-mix"></div>
                </div>
                <div class="hv-ops-panel">
                  <div class="hv-ops-panel-h">Needs attention</div>
                  <div class="hv-ops-attention"></div>
                </div>
              </div>
              <div class="hv-ops-panel">
                <div class="hv-ops-panel-h">By user <span class="hv-ops-users-count"></span></div>
                <div class="hv-ops-userbars"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="ab-tab-panel ab-tab-panel-list">
          <div class="log-ab-ro-card log-ab-ro-card--flush hv-ops-list-card">
            <div class="hv-ops-list-toolbar">
              <span class="hv-ops-user-filter hv-ops-search-filter"><span class="hv-ops-user-filter-lbl">Find</span>
              <input type="search" class="form-control input-xs hv-ops-search" placeholder="Search lists…"></span>
            </div>
            <div class="hv-ops-overview">
              <div class="hv-ops-panel">
                <div class="hv-ops-panel-h">By user <span class="hv-ops-users-count-list"></span></div>
                <div class="hv-ops-table-wrap hv-ops-users-wrap"></div>
              </div>
              <div class="hv-ops-panel hv-ops-unassigned-panel" style="display:none;">
                <div class="hv-ops-panel-h">Unassigned HV jobs</div>
                <div class="hv-ops-table-wrap hv-ops-unassigned-wrap"></div>
              </div>
              <div class="hv-ops-panel">
                <div class="hv-ops-panel-h">Brand board <span class="hv-ops-work-count"></span></div>
                <div class="hv-ops-table-wrap hv-ops-work-wrap"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="ab-tab-panel ab-tab-panel-alerts">
          <div class="log-ab-ro-card log-ab-ro-card--flush hv-ops-alerts-card">
            <div class="hv-ops-alerts-toolbar">
              <button type="button" class="btn btn-default btn-xs hv-ops-alerts-refresh" title="Refresh"><i class="fa fa-refresh"></i></button>
              <span class="hv-ops-user-filter"><span class="hv-ops-user-filter-lbl">User</span>
              <select class="form-control input-xs hv-ops-filter-alert-user"></select></span>
            </div>
            <div class="hv-ops-alerts-booking-format">
              <div class="dash-alerts-section hv-ops-dash-alerts-section"></div>
              <div class="doc-alerts-cards-wrapper hv-ops-ops-alert-cards-wrap" style="margin-bottom: 0;">
                <div class="doc-alerts-cards hv-ops-ops-alert-cards"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
