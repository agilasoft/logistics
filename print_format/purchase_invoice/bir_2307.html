<!-- BIR Form 2307 — vector PDF preview (fields stamped on source PDF) -->
<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }

		@page { size: 8.5in 13in; margin: 0; }

		html, body {
			margin: 0;
			padding: 0;
			width: 8.5in;
			height: 13in;
			overflow: hidden;
			background: #fff;
		}

		.pdf-page {
			width: 8.5in;
			height: 13in;
			border: 0;
			display: block;
		}

		.missing-template {
			padding: 20px;
			font-family: Arial, sans-serif;
			font-size: 12px;
			color: #333;
		}
	</style>
</head>
<body>
{% if doc.doctype != 'Purchase Invoice' %}
<div class="missing-template">Wrong print format. Use on Purchase Invoice only.</div>
{% else %}
{% set pdf_uri = frappe.call('logistics.print_format.purchase_invoice.bir_2307_pdf.get_embedded_pdf', doctype=doc.doctype, name=doc.name) %}
<embed class="pdf-page" type="application/pdf" src="{{ pdf_uri }}" />
{% endif %}
</body>
</html>
