<!-- BDO Telegraphic Transfer — values only on blank page (for pre-printed forms) -->
{% if doc.doctype != 'Payment Entry' %}
<div class="missing-template">Wrong print format. Use on Payment Entry only.</div>
{% else %}
{% set preview = frappe.call('logistics.print_format.payment_entry.bank_forms_pdf.get_embedded_blank_pdf', doctype=doc.doctype, name=doc.name) %}
<style>
	.print-format.print-format-preview {
		max-width: none !important;
		width: 100% !important;
		min-height: 0 !important;
		padding: 0 !important;
		margin: 0 !important;
		background: #fff;
		overflow: visible !important;
	}

	.bdo-pdf-viewer {
		display: block;
		width: 100%;
		height: {{ preview.height_mm + 14 }}mm;
		min-height: {{ preview.height_mm + 14 }}mm;
		border: 0;
		margin: 0;
		padding: 0;
		background: #fff;
	}
</style>
<script>
(function () {
	try {
		var frame = window.frameElement;
		if (!frame) return;
		frame.style.width = "100%";
		frame.style.maxWidth = "none";
		frame.setAttribute("scrolling", "auto");
		var preview = frame.closest(".print-preview");
		if (preview) {
			preview.style.maxWidth = "none";
			preview.style.width = "100%";
		}
	} catch (e) {}
})();
</script>
<iframe
	class="bdo-pdf-viewer"
	title="BDO Telegraphic Transfer (blank)"
	src="{{ preview.src }}"
></iframe>
{% endif %}
