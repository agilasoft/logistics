[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "workflow_center"
authors = [
    {name = "Agilasoft Cloud Technologies Inc.", email = "info@agilasoft.com"}
]
description = "Workflow Center — unified cockpit for pending workflow actions across all doctypes"
requires-python = ">=3.14,<3.15"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "frappe",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/agilasoft/logistics"
Repository = "https://github.com/agilasoft/logistics"
Issues = "https://github.com/agilasoft/logistics/issues"

[tool.setuptools]
packages = ["workflow_center"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.json", "*.txt", "*.md", "*.py", "*.html", "*.js", "*.css"]
