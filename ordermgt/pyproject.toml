[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "ordermgt"
authors = [
    {name = "Agilasoft Cloud Technologies Inc.", email = "info@agilasoft.com"}
]
description = "Order Management — marketplace orders, listings, and stock for CargoNext warehouses"
requires-python = ">=3.10,<3.13"
readme = "README.md"
dynamic = ["version"]
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/agilasoft/logistics"
Repository = "https://github.com/agilasoft/logistics"
Issues = "https://github.com/agilasoft/logistics/issues"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"

[tool.setuptools]
packages = ["ordermgt"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.json", "*.txt", "*.md", "*.py", "*.html", "*.js", "*.css"]
