[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "logistics"
authors = [
    {name = "Agilasoft Cloud Technologies Inc.", email = "info@agilasoft.com"}
]
description = "CargoNext - Comprehensive Logistics Management System"
requires-python = ">=3.14,<3.15"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "zeep>=4.2",
    "xmltodict>=0.13",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/agilasoft/logistics"
Repository = "https://github.com/agilasoft/logistics"
Issues = "https://github.com/agilasoft/logistics/issues"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"

[tool.setuptools]
packages = ["logistics"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.json", "*.txt", "*.md", "*.py", "*.yml", "*.yaml", "*.html", "*.js", "*.css"]
